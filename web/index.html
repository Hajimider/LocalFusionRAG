<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法律辅助混合 RAG 知识库</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">LEGAL AI WORKSPACE</p><h1>法律辅助混合 RAG 知识库</h1></div>
    <div id="health" class="status" aria-live="polite">检查服务中...</div>
  </header>
  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <div class="panel-heading"><h2>法律知识库</h2><span id="index-state" class="badge">未检查</span></div>
        <label class="file-picker"><span>添加 PDF / DOCX / MD / TXT</span><input id="file-input" type="file" accept=".pdf,.docx,.md,.txt"></label>
        <button id="upload-button" class="button secondary" type="button">上传文档</button>
        <button id="build-button" class="button primary" type="button">重建知识库索引</button>
        <p id="index-message" class="muted" aria-live="polite"></p>
      </section>
      <section class="panel controls">
        <h2>回答设置</h2>
        <label class="check-row"><input id="rag-toggle" type="checkbox" checked><span>使用知识库检索</span></label>
        <label><span class="label">检索方式</span><select id="retrieval-mode"><option value="hybrid" selected>混合检索</option><option value="dense">向量检索</option><option value="bm25">BM25 检索</option></select></label>
        <label><span class="label">法律资料类型</span><select id="document-type"><option value="all" selected>法条与判例</option><option value="law">仅法条</option><option value="case">仅判例</option></select></label>
        <label><span class="label">法条效力状态</span><select id="validity"><option value="all" selected>全部状态</option><option value="current">现行有效</option><option value="historical">历史版本</option><option value="unknown">未标注</option></select></label>
        <label class="check-row"><input id="rewrite-toggle" type="checkbox" checked><span>查询改写</span></label>
        <label class="check-row"><input id="rerank-toggle" type="checkbox" checked><span>候选片段重排序</span></label>
        <label><span class="label">检索片段数</span><input id="top-k" type="number" min="1" max="8" value="4"></label>
      </section>
      <section class="panel note"><h2>服务状态</h2><p id="model-state" class="muted">模型未加载</p><p class="muted">回答仅供资料检索和案件辅助分析，不构成法律意见。</p></section>
    </aside>
    <section class="chat-panel">
      <div id="messages" class="messages" aria-live="polite"><div class="empty-state"><h2>开始提问</h2><p>问题会经过查询改写、混合检索和重排序，再交给模型生成带来源的回答。</p><div class="example-prompts" aria-label="示例问题"><button class="example-prompt" type="button" data-question="劳动合同法对用人单位未签订书面劳动合同是如何规定的？">未签劳动合同有什么后果？</button><button class="example-prompt" type="button" data-question="民法典对离婚冷静期是如何规定的？">离婚冷静期如何规定？</button><button class="example-prompt" type="button" data-question="消费者购买到不符合质量要求的商品时，可以主张哪些权利？">商品质量不合格怎么办？</button><button class="example-prompt" type="button" data-question="公司法对有限责任公司股东认缴出资期限有什么规定？">股东认缴期限有什么规定？</button></div></div></div>
      <form id="chat-form" class="composer"><textarea id="question" rows="3" maxlength="500" placeholder="输入关于法条、判例或案件事实的问题..." required></textarea><div class="composer-footer"><span id="chat-state" class="muted">就绪</span><button class="button primary" type="submit">发送问题</button></div></form>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
